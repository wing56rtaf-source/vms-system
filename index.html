 <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ระบบ VMS - ลงทะเบียนเข้าพื้นที่</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; padding: 20px; background-color: #f0f2f5; }
    .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
    .btn-ocr { background-color: #007bff; color: white; }
    .btn-switch { background-color: #6c757d; color: white; }
    .btn-save { background-color: #28a745; color: white; width: 100%; font-size: 18px; margin-top: 10px; }
    #capturedPreview { width: 100px; height: 100px; border: 2px solid #28a745; border-radius: 8px; object-fit: cover; display: none; margin-top: 10px; }
    #status { margin-top: 10px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>📝 ลงทะเบียนผู้ผ่านเข้า-ออก</h2>
  
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>
  
  <div class="btn-group">
    <button class="btn-ocr" onclick="runOCR()">🔍 1. สแกนบัตร (OCR)</button>
    <button class="btn-switch" onclick="switchCamera()">🔄 สลับกล้อง</button>
  </div>

  <div id="status">กำลังรอเปิดกล้อง...</div>

  <div class="form-group">
    <label>เลขบัตรประชาชน:</label>
    <input type="text" id="idCard" placeholder="จะแสดงผลหลังสแกน หรือพิมพ์เองที่นี่">
  </div>

  <div class="form-group">
    <label>ชื่อ-นามสกุล:</label>
    <input type="text" id="fullName" placeholder="จะแสดงผลหลังสแกน หรือพิมพ์เองที่นี่">
  </div>

  <div class="form-group">
    <label>สถานที่ที่จะไปติดต่อ (Destination):</label>
    <input type="text" id="destination" placeholder="พิมพ์ระบุพื้นที่/แผนก">
  </div>

  <div class="form-group" style="text-align: center;">
    <button class="btn-ocr" style="background-color: #17a2b8;" onclick="takePhoto()">📸 2. ถ่ายภาพใบหน้า</button>
    <img id="capturedPreview" />
  </div>

  <button class="btn-save" onclick="finalSubmit()">✅ 3. บันทึกข้อมูลทั้งหมด</button>
</div>

<script>
  //const GOOGLE_API_URL = "YOUR_WEB_APP_URL_HERE"; // ใส่ URL จาก Google App Script
  const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbz-xVzLgx_xYmjkmdy_nwLf0mIJjGEWYznv8o374DK5QO-QXioo5oRK-f-OlsempjzE/exec";
</script>  
 
<script>
// const GOOGLE_API_URL = "YOUR_WEB_APP_URL_HERE"; // อย่าลืมใส่ URL ของคุณ
  
  let videoStream;
  let currentCameraIndex = 0;
  let videoDevices = [];
  let capturedBase64 = "";
  let currentFaceDescriptor = []; // เก็บตัวเลขใบหน้า

  // สร้างตัวแปรเช็คสถานะ AI
  let isAIReady = false; 

  // --- โหลดโมเดล AI ใบหน้า ---
  async function loadFaceAI() {
    const statusTxt = document.getElementById('status');
    const btnPhoto = document.querySelector('.btn-ocr[onclick="takePhoto()"]');
    
    // ปิดปุ่มถ่ายรูปไว้ก่อน จนกว่า AI จะพร้อม
    btnPhoto.disabled = true;
    btnPhoto.innerText = "⏳ รอ AI โหลด...";
    statusTxt.innerText = "⏳ กำลังโหลดสมอง AI... (อาจใช้เวลา 10-20 วินาที)";
    statusTxt.style.color = "blue";
    
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    
    try {
      // ใช้ Promise.all เพื่อบังคับให้รอโหลดครบทั้ง 3 ตัวพร้อมกัน
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      
      // เมื่อโหลดเสร็จทั้งหมด ค่อยเปิดปุ่มให้ใช้งาน
      isAIReady = true;
      btnPhoto.disabled = false;
      btnPhoto.innerText = "📸 2. ถ่ายภาพใบหน้า";
      statusTxt.innerText = "✅ ระบบ AI ใบหน้าพร้อมใช้งาน!";
      statusTxt.style.color = "green";
      
    } catch (err) {
      console.error(err);
      statusTxt.innerText = "❌ โหลด AI ไม่สำเร็จ โปรดรีเฟรช (F5)";
      statusTxt.style.color = "red";
    }
  }

  // --- ระบบจัดการกล้อง (เหมือนเดิม) ---
  async function initCamera(deviceId = null) {
    if (videoStream) videoStream.getTracks().forEach(track => track.stop());
    const constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : true };
    try {
      videoStream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('video').srcObject = videoStream;
      if (videoDevices.length === 0) {
        const devices = await navigator.mediaDevices.enumerateDevices();
        videoDevices = devices.filter(d => d.kind === 'videoinput');
      }
    } catch (err) { alert("เข้าถึงกล้องไม่ได้"); }
  }

  async function switchCamera() {
    if (videoDevices.length < 2) return;
    currentCameraIndex = (currentCameraIndex + 1) % videoDevices.length;
    initCamera(videoDevices[currentCameraIndex].deviceId);
  }

  // --- ระบบถ่ายภาพและดึงโครงหน้า ---
  async function takePhoto() {
    // ป้องกันคนใจร้อนกดปุ่มก่อน AI โหลดเสร็จ
    if (!isAIReady) {
      alert("กรุณารอระบบ AI โหลดให้เสร็จก่อนครับ (รอให้ขึ้นข้อความสีเขียว)");
      return;
    }

    const btn = document.querySelector('.btn-ocr[onclick="takePhoto()"]');
    btn.disabled = true;
    document.getElementById('status').innerText = "⏳ กำลังจับภาพและวิเคราะห์ใบหน้า...";
    document.getElementById('status').style.color = "blue";

    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    // แสดงรูปชั่วคราว
    capturedBase64 = canvas.toDataURL('image/jpeg', 0.8);
    const preview = document.getElementById('capturedPreview');
    preview.src = capturedBase64;
    preview.style.display = "inline-block";

    try {
      // ให้ AI ตรวจจับใบหน้า
      const detection = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions())
                                     .withFaceLandmarks()
                                     .withFaceDescriptor();
                                     
      if (detection) {
        currentFaceDescriptor = Array.from(detection.descriptor);
        document.getElementById('status').innerText = "✅ ตรวจพบใบหน้าพร้อมบันทึก";
        document.getElementById('status').style.color = "green";
      } else {
        alert("⚠️ AI มองไม่เห็นใบหน้า หรือหน้าเล็กเกินไป \nกรุณาให้ผู้ติดต่อมองกล้องแล้วกดถ่ายใหม่ครับ");
        currentFaceDescriptor = []; // เคลียร์ค่าทิ้ง
        document.getElementById('status').innerText = "❌ ไม่พบใบหน้า (ถ่ายรูปใหม่)";
        document.getElementById('status').style.color = "orange";
      }
    } catch (error) {
      console.error("Face AI Error:", error);
      document.getElementById('status').innerText = "❌ เกิดข้อผิดพลาดของ AI ตอนวิเคราะห์";
      document.getElementById('status').style.color = "red";
    } finally {
      btn.disabled = false;
    }
  }

// --- ระบบ OCR ---
  async function runOCR() {
    const btn = document.querySelector('.btn-ocr');
    btn.disabled = true;
    document.getElementById('status').innerText = "⏳ กำลังสแกนบัตร...";

    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    try {
      const result = await Tesseract.recognize(canvas.toDataURL('image/png'), 'tha+eng');
      const text = result.data.text;

      // สกัดเลขบัตร
      const idMatch = text.match(/[0-9]{13}/) || text.match(/[0-9]\s?[0-9]{4}\s?[0-9]{5}\s?[0-9]{2}\s?[0-9]/);
      if (idMatch) document.getElementById('idCard').value = idMatch[0].replace(/\s/g, '');

      // สกัดชื่อ (ค้นหาจากคำนำหน้า)
      const prefixes = ["นาย", "นาง", "นางสาว"];
      const lines = text.split('\n');
      for (let line of lines) {
        if (prefixes.some(p => line.includes(p))) {
          document.getElementById('fullName').value = line.replace(/ชื่อตัว|และชื่อสกุล|Name|:/gi, '').trim();
          break;
        }
      }
      document.getElementById('status').innerText = "✅ สแกนเสร็จสิ้น (โปรดตรวจสอบข้อมูล)";
    } catch (e) {
      alert("OCR ผิดพลาด: " + e.message);
    } finally {
      btn.disabled = false;
    }
  }

// --- ส่งข้อมูลชุดสุดท้าย (เพิ่มระบบดัก Error ขั้นสูง) ---
  async function finalSubmit() {
    const data = {
      idCard: document.getElementById('idCard').value,
      fullName: document.getElementById('fullName').value,
      destination: document.getElementById('destination').value,
      image: capturedBase64,
      faceDescriptor: currentFaceDescriptor 
    };

    if (!data.idCard || !data.destination || !capturedBase64 || currentFaceDescriptor.length === 0) {
      alert("กรุณากรอกข้อมูลและถ่ายภาพใบหน้าให้สมบูรณ์");
      return;
    }

    const statusTxt = document.getElementById('status');
    statusTxt.innerText = "⏳ กำลังประมวลผลประวัติใบหน้า... (รอหลังบ้าน Google ตอบกลับ)";
    statusTxt.style.color = "blue";
    
    try {
      const response = await fetch(GOOGLE_API_URL, { 
        method: "POST", 
        body: JSON.stringify(data) 
      });
      
      const result = await response.json();
      
      // เช็คว่าระบบหลังบ้านทำงานสำเร็จหรือไม่
      if (result.status === "success") {
        if (result.isKnownUser) {
          document.body.style.backgroundColor = "#d4edda"; 
          alert("🟢 แถบสีเขียว: ผู้ติดต่อท่านนี้เคยเข้าพื้นที่แล้ว \nบันทึกข้อมูลเรียบร้อย!");
        } else {
          document.body.style.backgroundColor = "#fff3cd"; 
          alert("🟡 แถบสีเหลือง: ผู้ติดต่อใหม่ (ไม่เคยเข้าพื้นที่) \nบันทึกข้อมูลลงฐานระบบเรียบร้อย!");
        }
        setTimeout(() => { location.reload(); }, 3000);
      } 
      // ถ้าระบบหลังบ้านส่ง Error กลับมา ให้แสดงบนหน้าจอทันที!
      else {
        alert("Google Script แจ้ง Error ว่า: \n\n" + result.message);
        statusTxt.innerText = "❌ เกิด Error ที่ระบบหลังบ้าน";
        statusTxt.style.color = "red";
      }
      
    } catch (e) {
      console.error("Fetch Error:", e);
      alert("ไม่สามารถติดต่อกับ Google Script ได้ \nโปรดตรวจสอบว่าก๊อปปี้ลิงก์ URL ถูกต้องหรือไม่");
      statusTxt.innerText = "❌ ขาดการเชื่อมต่อกับเซิร์ฟเวอร์";
      statusTxt.style.color = "red";
    }
  }

  // เริ่มต้นระบบเมื่อเปิดเว็บ
  initCamera();
  loadFaceAI(); // สั่งให้โหลดสมอง AI ใบหน้า
</script>

</body>
</html>
